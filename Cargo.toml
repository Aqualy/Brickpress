[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["font"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.90"
authors = ["Aqualy"]
license-file = "LICENSE"
publish = false

[workspace.dependencies]
brickpress-core = { path = "crates/brickpress-core" }
brickpress-render = { path = "crates/brickpress-render" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
fastrand = "2"
log = "0.4"
thiserror = "2"
smallvec = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
