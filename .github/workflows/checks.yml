name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    name: Rust workspace
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux windowing and software GPU
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # GPU tests use the platform's software adapter where no GPU exists
      # (WARP, llvmpipe/lavapipe) and skip themselves if none is available.
      - run: cargo test --workspace --locked
        env:
          BRICKPRESS_ARTIFACTS: ${{ runner.temp }}/brickpress-artifacts
      - run: cargo test --release --locked -p brickpress-render --test perf -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.os }}
          path: ${{ runner.temp }}/brickpress-artifacts
          retention-days: 14
          if-no-files-found: ignore
