[package]
name = "brickpress"
version = "1.0.0"
description = "A desktop studio for brick-based print compositions"
authors = ["Aqualy"]
edition = "2021"
rust-version = "1.90"
publish = false
license-file = "../LICENSE"

[lib]
name = "brickpress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[patch.crates-io]
# Test-only compatibility patch: upstream 1.4.0 still uses Windows COM 0.61,
# while Tauri 2.12/WebView2 0.39 use COM 0.62. Never linked into installers.
tauri-plugin-wdio-webdriver = { path = "testing/tauri-plugin-wdio-webdriver" }
