[package]
name = "brickpress-mcp"
description = "Model Context Protocol server for Brickpress: lets agents compose, preview and export boards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
brickpress-core.workspace = true
brickpress-render.workspace = true
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
serde.workspace = true
serde_json.workspace = true
schemars = "1"
interprocess = "2"
base64 = "0.22"
log.workspace = true
anyhow = "1"
